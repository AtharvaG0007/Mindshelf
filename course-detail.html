<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="/favicon.ico" sizes="any" type="image/x-icon">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#2d69a0">
<title>Learn - Mindshelf</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="learning-page">
<header>
    <h2>Mindshelf</h2>
    <nav>
        <a href="index.html">Home</a>
        <a href="courses.html">Courses</a>
        <a href="about.html">About</a>
    </nav>
</header>
<div class="learning-wrap">
    <aside class="topic-sidebar">
        <a href="courses.html" class="back-link">← Back to Courses</a>
        <h2 id="side-title">Course Topics</h2>
        <div id="topic-list"></div>
    </aside>
    <main class="lesson-area">
        <p class="eyebrow">YOUR LEARNING SPACE</p>
        <div class="lesson-progress"><span id="topic-count">Topic 1</span><span>Beginner-friendly lessons</span></div>
        <h1 id="lesson-title">Welcome</h1>
        <p id="lesson-level" class="lesson-level"></p>
        <section class="lesson-section">
            <h2>Explanation</h2>
            <p id="lesson-explanation"></p>
        </section>
        <section class="lesson-section">
            <h2>Important Points</h2>
            <ul id="lesson-points"></ul>
        </section>
        <section class="lesson-section" id="syntax-section">
            <h2>Syntax</h2>
            <pre><code id="lesson-syntax"></code></pre>
        </section>
        <section class="lesson-section">
            <h2>Programming Example</h2>
            <pre><code id="lesson-example"></code></pre>
        </section>
        <section class="lesson-section">
            <h2>Expected Output</h2>
            <pre class="output"><code id="lesson-output"></code></pre>
        </section>
        <section class="lesson-section">
            <h2>Real-Life Application</h2>
            <p id="lesson-application"></p>
        </section>
        <div class="lesson-buttons">
            <button id="previous-button" class="white-btn">← Previous Topic</button>
            <button id="next-button" class="black-btn">Next Topic →</button>
        </div>
    </main>
</div>
<footer>© 2026 Mindshelf</footer>
<script src="script.js"></script>
</body>
</html>
